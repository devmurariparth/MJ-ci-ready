name: Build Expanded MJ and Release v0.6.0

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: mj-expanded-release-v0.6.0
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v7

      - name: Checkout expanded MJ source
        uses: actions/checkout@v7
        with:
          repository: devmurariparth/pikachu
          ref: main
          path: mj-source
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        working-directory: mj-source
        shell: bash
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Run unit tests, lint and build debug APK
        working-directory: mj-source
        run: ./gradlew testDebugUnitTest :app:lintDebug assembleDebug --stacktrace

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          test -s mj-source/app/build/outputs/apk/debug/app-debug.apk
          cp mj-source/app/build/outputs/apk/debug/app-debug.apk MJ-v0.6.0.apk
          ls -lh MJ-v0.6.0.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MJ-v0.6.0-debug-APK
          path: MJ-v0.6.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with expanded MJ APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0
          name: MJ v0.6.0
          body: |
            MJ Android test release (versionName 0.6.0, versionCode 6).

            Built from the expanded source repository: devmurariparth/pikachu.

            Included source capabilities: premium animated assistant orb and chat UI; Gujarati, Hindi and English normalization; local command routing; typed action/tool contracts; permission and policy gate; contact disambiguation and call flow; Spotify, YouTube and YouTube Music provider handling; WhatsApp and SMS intents; task/reminder features; memory controls; vision consent flow; and Android system voice-interaction entry point.

            Important limitations: selecting MJ as the default digital assistant is a separate user-controlled Android setting. This release does not implement an always-listening "Hey MJ" hotword. Music providers may open a search/result view rather than guarantee automatic playback. Phone calling requires the appropriate user-granted Contacts/Phone permissions.

            This is a debug-signed testing APK, not a production Play Store release.
          files: MJ-v0.6.0.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
