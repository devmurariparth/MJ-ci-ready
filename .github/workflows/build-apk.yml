name: Build MJ-ci-ready 3.0.1 and Publish APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: mj-ci-ready-3-0-1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout MJ-ci-ready source
        uses: actions/checkout@v7

      - name: Verify this repository contains the Android app
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/mj/agent/MainActivity.kt
          grep -q 'applicationId = "com.mj.agent"' app/build.gradle.kts

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.0.0"

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Run Android lint and build MJ debug APK
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MJ-v3.0.1.apk
          ls -lh MJ-v3.0.1.apk
          sha256sum MJ-v3.0.1.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MJ-v3.0.1-debug-APK
          path: MJ-v3.0.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with MJ-ci-ready APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.1
          name: MJ 3.0.1 (MJ-ci-ready source)
          body: |
            MJ Android test release.

            Built directly from devmurariparth/MJ-ci-ready, not from another repository.
            Package ID: com.mj.agent
            versionName: 3.0.1
            versionCode: 6

            Included: Gujarati/Hindi/English tap-to-talk assistant; local app launch, contact lookup and dialer, WhatsApp, alarms with minutes, timers with hours/minutes/seconds, flashlight, Spotify, YouTube, YouTube Music and SimpMusic routing; media volume up/down/set/mute/unmute; next/previous/pause/resume media-key commands; MediaPipe on-device chat/agent; floating accessibility orb; and the existing glass-style Compose interface.

            SimpMusic uses the standard Android media-search intent when supported; otherwise MJ opens the SimpMusic app. Automatic playback is not guaranteed. Media-key commands are sent to Android's active media-key consumer.

            This is a debug-signed test APK, not a production Play Store release. Android only permits an in-place update when the signing certificate matches the installed app. If the installed v0.5.0 build has a different debug certificate, Android may require removing that old build before installing this one; its private app data (including an imported model) may then need to be restored or imported again.
          files: MJ-v3.0.1.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
