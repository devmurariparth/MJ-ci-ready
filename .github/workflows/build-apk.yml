name: Build MJ debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Gradle project root
        run: |
          set -euo pipefail
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            dir="."
          else
            f="$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -n 1)"
            if [ -z "$f" ]; then echo "::error::No settings.gradle(.kts) found in the repository"; exit 1; fi
            dir="$(dirname "$f")"
          fi
          echo "Gradle project root: $dir"
          echo "MJ_DIR=$dir" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.0.0"

      - name: Set up Gradle 9.1.0 (no wrapper needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build debug APK
        working-directory: ${{ env.MJ_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        working-directory: ${{ env.MJ_DIR }}
        run: |
          set -euo pipefail
          ls -l app/build/outputs/apk/debug/
          test -n "$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MJ-debug-APK
          path: ${{ env.MJ_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
