name: Build and Release MJ APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Locate Gradle project root
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            dir="."
          else
            f="$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -n 1)"
            if [ -z "$f" ]; then echo "::error::No settings.gradle(.kts) found in the repository"; exit 1; fi
            dir="$(dirname "$f")"
          fi
          echo "Gradle project root: $dir"
          echo "MJ_DIR=$dir" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.0.0"

      - name: Set up Gradle 9.1.0 (no wrapper needed)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Show build environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build debug APK
        working-directory: ${{ env.MJ_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        working-directory: ${{ env.MJ_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ls -l app/build/outputs/apk/debug/
          compgen -G "app/build/outputs/apk/debug/*.apk" >/dev/null

      - name: Upload debug APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MJ-debug-APK
          path: ${{ env.MJ_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: MJ v0.3.0
          body: |
            MJ Android debug build (versionName 0.3, versionCode 3).

            This is a debug/test APK for installation and testing. It is not a production-signed release.
          files: ${{ env.MJ_DIR }}/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
